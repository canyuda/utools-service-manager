<!DOCTYPE html>
<!-- ============================================================
  PROTOTYPE（原型，用后即弃，勿当生产代码）
  问题：uTools 插件『Windows 服务管理』的主界面该长什么样？
        三种结构不同的布局变体，在 800x544 的 uTools 窗口内对比。
  用法：浏览器直接打开本文件。
    ?variant=A|B|C   布局变体（A=卡片手风琴 B=紧凑表格 C=分栏主从），底部浮条或 ←/→ 切换
    ?view=main|add|empty   页面视图
    ?theme=light|dark      主题
    ?expand=Redis          展开某服务详情（A=手风琴 / B=底部面板 / C=右侧选中）
    ?bar=0                 隐藏原型切换浮条（截图用）
  数据为写死的 mock，只读原型，不接任何真实服务。
============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>prototype · Windows 服务管理 (uTools 插件)</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --text:#1f2329; --sub:#646a73;
    --border:#e5e6eb; --hover:#f2f3f5; --active:#e8f3ff;
    --green:#34c77b; --gray:#909399; --amber:#e6a23c; --blue:#409eff; --red:#f56c6c;
    --green-bg:#e8f8ef; --amber-bg:#fdf3e3; --blue-bg:#e8f3ff; --red-bg:#fdeaea; --gray-bg:#f0f1f2;
    --shadow:0 1px 4px rgba(0,0,0,.06);
  }
  :root[data-theme="dark"]{
    --bg:#1b1c20; --card:#26272c; --text:#e6e7ea; --sub:#9b9ca5;
    --border:#3a3b42; --hover:#2f3036; --active:#1d3348;
    --green-bg:#17301f; --amber-bg:#372a15; --blue-bg:#152a3d; --red-bg:#3a1f1f; --gray-bg:#303136;
    --shadow:0 1px 4px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px;
    width:800px; height:544px; overflow:hidden;
  }
  #app{height:544px; display:flex; flex-direction:column;}

  /* ---------- 顶部 ---------- */
  .topbar{
    display:flex; align-items:center; gap:10px;
    padding:10px 16px; background:var(--card); border-bottom:1px solid var(--border);
    flex:none;
  }
  .topbar h1{font-size:15px; font-weight:600; flex:1;}
  .btn{
    border:1px solid var(--border); background:var(--card); color:var(--text);
    border-radius:6px; padding:5px 12px; font-size:12.5px; cursor:pointer;
  }
  .btn.primary{background:var(--blue); border-color:var(--blue); color:#fff;}
  .btn.icon{padding:5px 8px; font-size:14px;}
  .banner{
    flex:none; padding:6px 16px; font-size:12px; color:#8a5b00;
    background:var(--amber-bg); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px;
  }
  .banner a{color:var(--blue); text-decoration:none; cursor:pointer;}
  :root[data-theme="dark"] .banner{color:#e8b45a;}

  /* ---------- 状态/类型 徽章 ---------- */
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:1px; flex:none;}
  .dot.Running{background:var(--green);} .dot.Stopped{background:transparent; border:2px solid var(--gray); width:7px; height:7px;}
  .dot.Paused{background:linear-gradient(90deg,var(--amber) 50%,transparent 50%); border:1.5px solid var(--amber);}
  .dot.Pending{background:var(--blue); animation:pulse 1s infinite;}
  .dot.Unknown{background:var(--red);}
  @keyframes pulse{50%{opacity:.3;}}
  .tag{
    display:inline-block; font-size:11px; line-height:1; padding:4px 8px;
    border-radius:4px; border:1px solid; white-space:nowrap;
  }
  .tag.st-Running{color:var(--green); border-color:var(--green); background:var(--green-bg);}
  .tag.st-Stopped{color:var(--gray); border-color:var(--gray); background:var(--gray-bg);}
  .tag.st-Paused{color:var(--amber); border-color:var(--amber); background:var(--amber-bg);}
  .tag.st-Pending{color:var(--blue); border-color:var(--blue); background:var(--blue-bg);}
  .tag.ty-auto{color:var(--blue); border-color:var(--blue); background:var(--blue-bg);}
  .tag.ty-demand{color:var(--sub); border-color:var(--sub); background:transparent;}
  .tag.ty-disabled{color:var(--red); border-color:var(--red); background:var(--red-bg);}
  .stateword-Running{color:var(--green);} .stateword-Stopped{color:var(--sub);}
  .stateword-Paused{color:var(--amber);} .stateword-Pending{color:var(--blue);}

  /* ---------- 操作按钮 ---------- */
  .acts{display:flex; gap:6px; align-items:center;}
  .op{
    width:26px; height:26px; border-radius:6px; border:1px solid var(--border);
    background:var(--card); cursor:pointer; font-size:12px; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; color:var(--text);
  }
  .op:hover{background:var(--hover);}
  .op.start{color:var(--green); border-color:var(--green);}
  .op.stop{color:var(--red); border-color:var(--red);}
  .op.pause,.op.resume{color:var(--amber); border-color:var(--amber);}
  .op.restart{color:var(--blue); border-color:var(--blue);}
  .op.big{width:auto; padding:6px 12px; font-size:12.5px; gap:5px;}
  .op:disabled{opacity:.35; cursor:not-allowed;}

  /* ---------- A：卡片手风琴 ---------- */
  .filterbar{
    flex:none; display:flex; align-items:center; gap:6px;
    padding:8px 16px; font-size:12.5px; color:var(--sub);
  }
  .ftab{padding:4px 10px; border-radius:14px; cursor:pointer; border:1px solid transparent;}
  .ftab.on{background:var(--active); color:var(--blue); font-weight:600;}
  .ftab .n{opacity:.75; margin-left:2px;}
  .filterbar .refresh{margin-left:auto; font-size:12px;}
  .cards{flex:1; min-height:0; overflow-y:auto; padding:2px 16px 16px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:8px; margin-bottom:8px; box-shadow:var(--shadow);}
  .card .row{
    display:flex; align-items:center; padding:9px 14px; cursor:pointer; gap:8px;
  }
  .card .row:hover{background:var(--hover); border-radius:8px;}
  .card .row .name{font-weight:600; font-size:13.5px;}
  .card .row .sub{flex:1; font-size:12px; color:var(--sub); margin-top:2px;}
  .card .row .mid{flex:1; min-width:0;}
  .detail{border-top:1px dashed var(--border); padding:12px 16px; background:var(--hover); border-radius:0 0 8px 8px;}
  .kv{display:flex; font-size:12.5px; margin-bottom:7px; gap:8px;}
  .kv .k{width:64px; color:var(--sub); flex:none;}
  .kv .v{flex:1; word-break:break-all;}
  .detail .ops{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .detail .remove{margin-top:10px; text-align:right;}
  .detail .remove a{color:var(--red); font-size:12px; cursor:pointer; text-decoration:none;}
  select.starttype{
    font-size:12.5px; padding:4px 8px; border-radius:6px; border:1px solid var(--border);
    background:var(--card); color:var(--text);
  }

  /* ---------- B：紧凑表格 ---------- */
  .grid{flex:1; min-height:0; overflow-y:auto; padding:8px 16px 8px;}
  table.svc{width:100%; border-collapse:collapse; background:var(--card); border-radius:8px; overflow:hidden; box-shadow:var(--shadow);}
  table.svc th{
    font-size:11.5px; color:var(--sub); text-align:left; font-weight:500;
    padding:6px 12px; border-bottom:1px solid var(--border); background:var(--hover);
  }
  table.svc td{padding:6px 12px; border-bottom:1px solid var(--border); font-size:12.5px;}
  table.svc tr.svcrow{cursor:pointer;}
  table.svc tr.svcrow:hover{background:var(--hover);}
  table.svc tr.svcrow.sel{background:var(--active);}
  .sheet{
    flex:none; margin:0 16px 12px; background:var(--card); border:1px solid var(--border);
    border-radius:10px; box-shadow:0 -2px 12px rgba(0,0,0,.12); padding:10px 14px;
  }
  /* B 变体底部面板空间有限：紧凑化，隐藏移除入口 */
  .sheet .detail{padding:4px 2px; border-top:none; background:transparent;}
  .sheet .kv{margin-bottom:5px; font-size:12px;}
  .sheet .kv .k{width:58px;}
  .sheet .remove{display:none;}
  .sheet .ops{margin-top:6px;}

  /* ---------- C：分栏主从 ---------- */
  .split{flex:1; display:flex; min-height:0;}
  .split .left{width:250px; flex:none; border-right:1px solid var(--border); overflow-y:auto; padding:8px;}
  .split .left .item{padding:8px 10px; border-radius:7px; cursor:pointer; margin-bottom:2px;}
  .split .left .item:hover{background:var(--hover);}
  .split .left .item.sel{background:var(--active);}
  .split .left .item .nm{font-size:13px; font-weight:600; display:flex; align-items:center;}
  .split .left .item .sb{font-size:11px; color:var(--sub); margin-top:2px; display:flex; justify-content:space-between; align-items:center;}
  .split .right{flex:1; padding:16px; overflow-y:auto;}
  .split .right h2{font-size:15px; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .panel{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:12px;}
  .panel h3{font-size:12.5px; color:var(--sub); font-weight:500; margin-bottom:10px;}
  .panel .ops{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---------- add / empty ---------- */
  .searchrow{flex:none; padding:10px 16px;}
  .searchrow input{
    width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:13px; outline:none;
  }
  .addlist{flex:1; min-height:0; overflow-y:auto; padding:0 16px 16px;}
  .addrow{
    display:flex; align-items:center; gap:10px; padding:9px 12px;
    background:var(--card); border:1px solid var(--border); border-radius:8px; margin-bottom:6px;
  }
  .addrow .nm{font-weight:600; font-size:13px;}
  .addrow .sn{font-size:12px; color:var(--sub); flex:1;}
  .empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--sub);}
  .empty .gear{font-size:44px; opacity:.5;}
  .empty p{font-size:13px;}

  /* ---------- 原型切换浮条（非设计的一部分） ---------- */
  .protobar{
    position:fixed; left:50%; bottom:10px; transform:translateX(-50%);
    background:#111318; color:#fff; border-radius:999px; padding:6px 10px;
    display:flex; align-items:center; gap:10px; font-size:12px;
    box-shadow:0 4px 16px rgba(0,0,0,.4); z-index:99; font-family:Consolas,monospace;
  }
  .protobar button{
    background:#2a2d35; color:#fff; border:none; border-radius:50%;
    width:22px; height:22px; cursor:pointer; font-size:13px; line-height:1;
  }
  .protobar .hint{color:#8b8f9a; font-size:10.5px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="protobar" id="protobar" style="display:none">
  <button id="prev" title="上一个变体">‹</button>
  <span id="varlabel"></span>
  <button id="next" title="下一个变体">›</button>
  <span class="hint">←/→ 切换 · 原型浮条非设计稿内容</span>
</div>

<script>
/* ---------- mock 数据（取自本机真实服务的合理示例） ---------- */
const SERVICES = [
  {name:'Redis',   display:'Redis',         desc:'Redis 内存数据库服务（内置 --service-run）', bin:'C:\\Redis\\redis-server.exe --service-run redis.windows-service.conf', account:'NetworkService', startType:'auto',    state:'Running', acceptPause:false, added:true},
  {name:'Consul',  display:'Consul',        desc:'Consul Agent（NSSM 包装）',                  bin:'D:\\5-zujian\\nssm.exe',                                               account:'LocalSystem',    startType:'auto',    state:'Running', acceptPause:false, added:true},
  {name:'nginx',   display:'nginx',         desc:'nginx web server（NSSM 包装）',              bin:'D:\\5-zujian\\nssm.exe',                                               account:'LocalSystem',    startType:'auto',    state:'Running', acceptPause:false, added:true},
  {name:'Spooler', display:'Print Spooler', desc:'将文件加载到内存中以便稍后打印',             bin:'C:\\WINDOWS\\system32\\spoolsv.exe',                                   account:'LocalSystem',    startType:'demand',  state:'Stopped', acceptPause:true,  added:false},
  {name:'Fax',     display:'Fax',           desc:'发送和接收传真',                             bin:'C:\\WINDOWS\\system32\\fxssvc.exe',                                    account:'NetworkService', startType:'demand',  state:'Paused',  acceptPause:true,  added:false},
];
const TYPE_TEXT = {auto:'自动', 'delayed-auto':'自动(延迟启动)', demand:'手动', disabled:'禁用'};
const STATE_TEXT = {Running:'运行中', Stopped:'已停止', Paused:'已暂停', StartPending:'正在启动…', StopPending:'正在停止…', Unknown:'未知'};
const OPS = [
  {k:'start',   icon:'▶', label:'启动'},
  {k:'stop',    icon:'■', label:'停止'},
  {k:'pause',   icon:'⏸', label:'暂停'},
  {k:'resume',  icon:'⏵', label:'恢复'},
  {k:'restart', icon:'↻', label:'重启'},
];
function legalOps(s){
  if(s.state==='StartPending'||s.state==='StopPending') return [];
  if(s.state==='Running') return s.acceptPause ? ['stop','pause','restart'] : ['stop','restart'];
  if(s.state==='Paused')  return ['stop','resume','restart'];
  if(s.state==='Stopped') return ['start'];
  return [];
}
function dotCls(s){ return (s.state==='StartPending'||s.state==='StopPending') ? 'Pending' : s.state; }
function stateTag(s){ return '<span class="tag st-'+dotCls(s)+'">'+STATE_TEXT[s.state]+'</span>'; }
function typeTag(s){
  const t = TYPE_TEXT[s.startType]||s.startType;
  const pre = s.startType==='delayed-auto' ? '⏱ ' : '';
  return '<span class="tag ty-'+s.startType+'">'+pre+t+'</span>';
}
/* 收起态：只渲染合法操作（图标按钮）；详情面板：五个全渲染、非法禁用 */
function opsInline(s){
  return '<span class="acts" onclick="stopBubble(event)">' + legalOps(s).map(k=>{
    const o = OPS.find(x=>x.k===k);
    return '<button class="op '+k+'" title="'+o.label+'">'+o.icon+'</button>';
  }).join('') + '</span>';
}
function opsFull(s){
  const legal = legalOps(s);
  return OPS.map(o=>
    '<button class="op big '+o.k+'" '+(legal.includes(o.k)?'':'disabled')+'>'+o.icon+' '+o.label+'</button>'
  ).join('');
}
function detailPanel(s, compact){
  const kv = (k,v)=>'<div class="kv"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';
  let html = kv('服务名', s.name);
  if(!compact) html += kv('显示名', s.display);
  html += kv('描述', s.desc)
    + kv('二进制', s.bin)
    + kv('账户', s.account)
    + kv('启动类型', '<select class="starttype">'
      + Object.keys(TYPE_TEXT).map(t=>'<option '+(t===s.startType?'selected':'')+'>'+TYPE_TEXT[t]+'</option>').join('')
      + '</select>')
    + '<div class="ops">'+opsFull(s)+'</div>'
    + '<div class="remove"><a>从列表移除</a></div>';
  return html;
}

/* ---------- 视图 ---------- */
function header(view){
  if(view==='add')
    return '<div class="topbar"><button class="btn icon" id="back">←</button><h1>添加服务</h1></div>';
  return '<div class="topbar"><h1>Windows 服务管理</h1>'
    + '<button class="btn icon" title="设置（MCP / 审计日志）">⚙</button>'
    + '<button class="btn primary" id="toadd">＋ 添加服务</button></div>'
    + '<div class="banner">⚠ uTools 未以管理员身份运行，修改启动类型 / 停止服务可能被拒绝 <a>以管理员身份重启</a><a>了解更多</a></div>';
}
function viewA(){
  const counts = {all:SERVICES.length, Running:0, Stopped:0, Paused:0};
  SERVICES.forEach(s=>{ if(counts[s.state]!=null) counts[s.state]++; });
  const exp = P.get("expand");
  const cards = SERVICES.map(s=>{
    const open = s.name===exp;
    return '<div class="card">'
      + '<div class="row" data-open="'+s.name+'">'
      +   '<span class="dot '+dotCls(s)+'"></span>'
      +   '<div class="mid"><div class="name">'+s.display+'</div><div class="sub">'+s.name+' · <span class="stateword-'+dotCls(s)+'">'+STATE_TEXT[s.state]+'</span></div></div>'
      +   typeTag(s) + opsInline(s)
      + '</div>'
      + (open ? '<div class="detail">'+detailPanel(s)+'</div>' : '')
      + '</div>';
  }).join('');
  return header('main')
    + '<div class="filterbar">'
    +   '<span class="ftab on">全部<span class="n">'+counts.all+'</span></span>'
    +   '<span class="ftab">运行中<span class="n">'+counts.Running+'</span></span>'
    +   '<span class="ftab">已停止<span class="n">'+counts.Stopped+'</span></span>'
    +   '<span class="ftab">已暂停<span class="n">'+counts.Paused+'</span></span>'
    +   '<span class="refresh">⟳ 每 2 秒自动刷新</span>'
    + '</div>'
    + '<div class="cards">'+cards+'</div>';
}
function viewB(){
  const sel = P.get("expand") || SERVICES[0].name;
  const s0 = SERVICES.find(x=>x.name===sel);
  const rows = SERVICES.map(s=>
    '<tr class="svcrow '+(s.name===sel?'sel':'')+'" data-open="'+s.name+'">'
    + '<td><span class="dot '+dotCls(s)+'"></span><b>'+s.display+'</b> <span style="color:var(--sub);font-size:11.5px">'+s.name+'</span></td>'
    + '<td>'+typeTag(s)+'</td>'
    + '<td><span class="stateword-'+dotCls(s)+'">'+STATE_TEXT[s.state]+'</span></td>'
    + '<td>'+opsInline(s)+'</td></tr>'
  ).join('');
  return header('main')
    + '<div class="grid"><table class="svc">'
    + '<thead><tr><th>服务</th><th>启动类型</th><th>状态</th><th style="width:120px">操作</th></tr></thead>'
    + '<tbody>'+rows+'</tbody></table></div>'
    + '<div class="sheet"><h3 style="font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px">'
    + '<span class="dot '+dotCls(s0)+'"></span>'+s0.display+' <span style="color:var(--sub);font-weight:400;font-size:11.5px">'+s0.name+'</span>'+stateTag(s0)+'</h3>'
    + detailPanel(s0, true)+'</div>';
}
function viewC(){
  const sel = P.get("expand") || SERVICES[0].name;
  const s0 = SERVICES.find(x=>x.name===sel);
  const items = SERVICES.map(s=>
    '<div class="item '+(s.name===sel?'sel':'')+'" data-open="'+s.name+'">'
    + '<div class="nm"><span class="dot '+dotCls(s)+'"></span>'+s.display+'</div>'
    + '<div class="sb"><span>'+s.name+'</span>'+typeTag(s)+'</div></div>'
  ).join('');
  return header('main')
    + '<div class="split"><div class="left">'+items+'</div>'
    + '<div class="right"><h2><span class="dot '+dotCls(s0)+'"></span>'+s0.display+' '+stateTag(s0)+'</h2>'
    + '<div class="panel"><h3>基本信息</h3>'+detailPanel(s0).replace(/<div class="remove">.*?<\/div>/,'')+'</div></div></div>';
}
function viewAdd(){
  const rows = SERVICES.map(s=>
    '<div class="addrow"><span class="dot '+dotCls(s)+'"></span>'
    + '<span class="nm">'+s.display+'</span><span class="sn">'+s.name+'</span>'
    + typeTag(s)
    + (s.added ? '<button class="btn" disabled>已添加</button>' : '<button class="btn primary">＋ 添加</button>')
    + '</div>').join('');
  return header('add')
    + '<div class="searchrow"><input placeholder="🔍 搜索服务名或显示名，回车加入列表（Enter 添加首个结果）"></div>'
    + '<div class="addlist">'+rows+'</div>';
}
function viewEmpty(){
  return header('main')
    + '<div class="empty"><div class="gear">⚙</div>'
    + '<p>还没有添加服务，点击右上角 ＋ 添加服务</p>'
    + '<p style="font-size:12px">把 Redis、Consul、nginx 等常用服务加入管理</p>'
    + '<button class="btn primary">＋ 添加服务</button></div>';
}

/* ---------- 原型骨架 ---------- */
const VARIANTS = [
  {k:'A', label:'A · 卡片手风琴（设计文档默认）'},
  {k:'B', label:'B · 紧凑表格 + 底部面板'},
  {k:'C', label:'C · 左右分栏主从'},
];
const P = new URLSearchParams(location.search);
function setParam(k,v){
  v==null ? P.delete(k) : P.set(k,v);
  history.replaceState(null,'', location.pathname+'?'+P.toString());
  render();
}
function render(){
  document.documentElement.dataset.theme = P.get('theme')==='dark' ? 'dark' : 'light';
  const view = P.get('view')||'main', variant = P.get('variant')||'A';
  let html;
  if(view==='add') html = viewAdd();
  else if(view==='empty') html = viewEmpty();
  else if(variant==='A') html = viewA();
  else if(variant==='B') html = viewB();
  else html = viewC();
  const app = document.getElementById('app');
  app.innerHTML = html;
  const back = document.getElementById('back');
  if(back) back.onclick = ()=>setParam('view',null);
  const toadd = document.getElementById('toadd');
  if(toadd) toadd.onclick = ()=>setParam('view','add');
  app.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('.op,select,button,a')) return;
      setParam('expand', el.dataset.open);
    });
  });
  renderBar(variant);
}
function stopBubble(e){ e.stopPropagation(); }
function renderBar(variant){
  const bar = document.getElementById('protobar');
  if(P.get('bar')==='0'){ bar.style.display='none'; return; }
  bar.style.display='flex';
  const i = VARIANTS.findIndex(v=>v.k===variant);
  document.getElementById('varlabel').textContent = VARIANTS[i].label;
  document.getElementById('prev').onclick = ()=>setParam('variant', VARIANTS[(i+2)%3].k);
  document.getElementById('next').onclick = ()=>setParam('variant', VARIANTS[(i+1)%3].k);
}
document.addEventListener('keydown', e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const variant = P.get('variant')||'A';
  const i = VARIANTS.findIndex(v=>v.k===variant);
  if(e.key==='ArrowLeft')  setParam('variant', VARIANTS[(i+2)%3].k);
  if(e.key==='ArrowRight') setParam('variant', VARIANTS[(i+1)%3].k);
});
render();
</script>
</body>
</html>
